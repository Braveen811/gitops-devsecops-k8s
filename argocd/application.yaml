apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-devsecops-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Braveen811/gitops-devsecops-k8s.git'
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev-environment
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true